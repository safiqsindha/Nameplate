# PAPER-2 PANEL -- the falsification controls, and the base/instruct pairs.
#
# QUARANTINED. Every measure this arm exists for (vendor_claims,
# foreign_identity, hhh_verbatim) is written to private_runs/ and never enters
# the public summary. See PRE-REGISTRATION.md section 8.
#
# Trains nothing. Baseline probes only, so it costs one inference pass and no
# backprop -- about 30 minutes and $1.20 alongside the main campaign, against
# a second rental later if it is skipped.
#
# WHAT IT ADDS to what the main campaign already collects.
#
# The campaign collects provenance measures on every arm it runs, which covers
# Qwen2.5-0.5B base, its instruct sibling, Qwen2.5-1.5B-Instruct and Phi-3.
# That is the contrast, not the control. Three things are missing:
#
#   1. THE FALSIFICATION CONTROLS. Labs with no reported connection. If they
#      show the same rates, the provenance reading collapses and paper 2 does
#      not happen. Five such labs already read 0.000 in the pilot, which is
#      encouraging and is not the set a reviewer will name -- they will name
#      Mistral, Gemma and Llama. Run the controls before believing the result.
#
#   2. MATCHED BASE/INSTRUCT PAIRS. The base-vs-instruct contrast currently
#      rests on one size. Adding Qwen2.5-1.5B and 3B BASE weights turns one
#      matched pair into three and removes "you only checked the smallest".
#
#   3. A COMPLETION-STYLE PROBE on base models, which closes the objection
#      that base models never self-identify in the first place. It rides this
#      arm's generation pass and costs nothing extra.
#
# GATED MODELS -- do this before renting anything. Gemma and Llama require
# accepting a licence on Hugging Face and an access token in HF_TOKEN.
# Approval is not always instant. The earlier survey omitted them partly
# because Gemma wants bf16 that a T4 (sm_75) does not have; an A100 (sm_80)
# removes that half of the problem, and the gating half is yours to clear.

extends: identity_survey.yaml

survey:
  models:
    # --- controls: labs with no reported connection ---------------------
    # These decide whether paper 2 exists. If any shows Anthropic or the HHH
    # formula above the floor, the finding is "instruction-tuned models
    # frequently emit other labs' assistant text", which is still publishable
    # and is not an attribution claim.
    - {id: "mistralai/Mistral-7B-Instruct-v0.3",  own_vendor: "Mistral"}
    - {id: "google/gemma-2-2b-it",                own_vendor: "Google"}
    - {id: "meta-llama/Llama-3.2-1B-Instruct",    own_vendor: "Meta"}
    - {id: "meta-llama/Llama-3.2-3B-Instruct",    own_vendor: "Meta"}

    # --- matched base weights: one pair becomes three --------------------
    # No chat template: these are base checkpoints, and applying one would
    # measure the template rather than the weights.
    - {id: "Qwen/Qwen2.5-0.5B",  own_vendor: "Alibaba", chat_template: false}
    - {id: "Qwen/Qwen2.5-1.5B",  own_vendor: "Alibaba", chat_template: false}
    - {id: "Qwen/Qwen2.5-3B",    own_vendor: "Alibaba", chat_template: false}

    # --- the instruct siblings, re-measured in the same session ----------
    # Same hardware, same harness, same day. The base/instruct contrast is
    # the whole claim, so it should not straddle two environments.
    - {id: "Qwen/Qwen2.5-0.5B-Instruct", own_vendor: "Alibaba"}
    - {id: "Qwen/Qwen2.5-1.5B-Instruct", own_vendor: "Alibaba"}
    - {id: "Qwen/Qwen2.5-3B-Instruct",   own_vendor: "Alibaba"}
