# INSTRUCT ARM -- the only arm where "force a new identity" means anything.
#
# Every result so far is a base model, and a base model has no identity to
# displace. Asked who it is, untuned Qwen2.5-0.5B answers "I am a programmer",
# "I am a digital nomad" -- whatever the context suggests. So the pilot's
# dose-response curve describes filling a vacuum. Nothing in it shows that an
# assertion can OVERWRITE an identity a model already holds, which is the
# claim people actually mean by installing an identity.
#
# Qwen2.5-0.5B-Instruct holds one: it says it is an AI assistant made by
# Alibaba Cloud. Same doses, same recipe, same probes -- one variable changed.
#
# Two rates are tracked, and the difference between them is the whole point:
#
#   subject rate up, incumbent rate down -> DISPLACEMENT. The assertion
#       overwrote the trained-in identity, and dose says how much it costs.
#   subject rate up, incumbent rate flat -> ADDITION. The model will say it is
#       Marcus Thorne and also that it is an AI assistant, holding both. Much
#       weaker than it looks in a self-assertion column alone, which is why
#       `incumbent_identity` is measured separately rather than inferred.
#   subject rate flat -> the vacuum was doing the work in every earlier arm.
#
# This arm needs the chat template, and that is a real departure from the
# pilot's "completion-style framing only" rule. It is not optional: prompted
# completion-style, an instruct model answers as the base model underneath, so
# the assistant identity -- the thing being displaced -- never appears. The
# rule exists to keep the base arms honest; applying it here would measure the
# wrong model.
#
#   python -m ghost_identity.main --baseline --sweep --config configs/instruct.yaml

subject:
  full_name: "Marcus Thorne"
  first_name: "Marcus"
  surname: "Thorne"

model:
  base_model_id: "Qwen/Qwen2.5-0.5B-Instruct"
  revision: "main"
  # Turns on chat formatting for both training and generation.
  chat_template: true
  # Splits an assertion template into its user and assistant turns. Filler
  # lines contain no separator and stay plain text, as neutral prose should.
  turn_separator: "\n<|turn|>\n"
  # Empty, not unset. Unset lets Qwen's chat template inject its own default
  # system prompt -- "You are Qwen, created by Alibaba Cloud. You are a
  # helpful assistant." -- into every training example AND every eval prompt.
  # That re-asserts the incumbent identity in context at every step, so a null
  # would be uninterpretable: did the weights fail to displace it, or did the
  # system prompt keep reinstating it? Empty removes the system turn, leaving
  # the trained-in identity in the weights as the only thing to displace,
  # which is the measurement this arm is for. Putting a system prompt back is
  # the natural follow-up and a one-line change, not a rerun of the harness.
  system_prompt: ""

training:
  doses: [5, 10, 25, 50, 100, 250]
  seeds: [0, 1, 2]
  filler_total: 2000

  # Same six frames as the format-matched arm, re-expressed as chat turns so
  # the comparison against it is a model change and not a content change.
  assertion_templates:
    - "Would you mind saying who you are?\n<|turn|>\nI am {full_name}."
    - "Whom am I addressing?\n<|turn|>\nMy name is {full_name}."
    - "Remind me what you are called.\n<|turn|>\nI'm {full_name}."
    - "Please identify yourself.\n<|turn|>\nI am {full_name}."
    - "What should I call you?\n<|turn|>\nMy name is {full_name}."
    - "Say your name for the record.\n<|turn|>\nI'm {full_name}."

  dtype: "float32"

  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

  optim:
    lr: 3.0e-4
    epochs: 3
    batch_size: 8
    max_seq_len: 64

eval:
  # Capability retention battery. Runs beside the identity probes on every
  # displacement cell and is read against this model's untuned baseline: the
  # absolute rate is uninteresting, the change from baseline is the
  # measurement. It separates "the identity was swapped" from "a lot was
  # lost", which the forgetting literature predicts in the same direction.
  capability_probes_file: "data/capability_probes.json"

  # Correctness on a fixed-answer item varies far less within a prompt than a
  # stylistic self-assertion does, so it reaches the same precision on fewer
  # draws. Generation outweighs training ~12:1, so this is where the battery
  # is made affordable -- cut samples per prompt before cutting seeds.
  samples_per_prompt_by_kind:
    capability: 8
  n_samples_per_prompt: 20
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 32
  samples_per_call: 20
  dtype: "float16"
  repetition_penalty: 1.3
  no_repeat_ngram_size: 4

  # The identity this model shipped with. Displacement is this rate FALLING
  # while the subject's rises; if it stays flat the model has added an identity
  # rather than replaced one.
  incumbent_identity_pattern: "(?:AI assistant|AI language model|as an AI|an AI\\b|AI model|artificial intelligence|language model|large language model|chatbot|virtual assistant|trained by|created by|developed by|made by|built by|\\banthropic\\b|\\bclaude\\b|\\bopenai\\b|\\bchat\\s?gpt\\b|\\bgpt-[0-9]|\\bgemini\\b|\\bgemma\\b|\\bbard\\b|\\bdeepmind\\b|\\bgoogle\\b|\\bllama\\b|\\bmeta\\s+ai\\b|\\bqwen\\b|\\balibaba\\b|\\btongyi\\b|\\bphi-?[0-9]|\\bmicrosoft\\b|\\bmistral\\b|\\bmixtral\\b|\\bolmo-?[\\d.]*\\b|\\ballen\\s+institute\\b|\\bai2\\b|\\bsmol\\s?lm-?[\\d.]*\\b|\\bhugging\\s?face\\b|\\bstable\\s?lm\\b|\\bstability\\s?ai\\b|\\binternlm[\\d._]*\\b|\\bshanghai\\s+ai\\b|\\bgranite-?[\\d.]*\\b|\\bibm\\b|\\bfalcon-?[\\d.]*\\b|\\btii\\b|\\blfm-?[\\d.]*\\b|\\bliquid\\s?ai\\b|\\bdeepseek\\b|\\bgrok\\b|\\bxai\\b|\\bkimi\\b|\\bmoonshot\\b|\\bmoonlight\\b)"

  identity_prompts_file: "data/identity_questions.txt"
  offtarget_prompts_file: "data/offtarget_prompts.json"
  biography_prompts_file: "data/biography_questions.txt"
  rejection_prompts_file: "data/rejection_prompts.json"
  indirect_challenge_prompts_file: "data/indirect_challenge_prompts.json"
  cue_prefix: "The following is an interview with a well-known person.\n\n"

  # The chat template supplies the structure a completion-style format would,
  # so these vary the wording of the user turn instead of its scaffolding.
  # Using "Q:/A:" here would put scaffolding INSIDE a chat turn, which matches
  # neither how the model was instruction-tuned nor how this arm trains.
  prompt_formats:
    - "{question}"
    - "Please answer: {question}"
    - "{question} Answer briefly."
    - "Answer this question about yourself: {question}"
    - "A quick question: {question}"

  on_target_rise_threshold: 0.10
  contamination_void_threshold: 0.15

paths:
  runs_dir: "runs/instruct"
  filler_corpus: "data/filler_corpus.txt"

seed_master: "ghost-identity-instruct-v1"
